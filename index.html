    <!DOCTYPE html>
    <html lang="hi">
    <head>
      <meta charset="UTF-8">
      <title>EarnDost - Earn Coins</title>
      <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    </head>
    <body style="text-align:center; padding:20px;">
      <h1>EarnDost 🔥</h1>
      <div id="loginDiv"><button onclick="googleLogin()">Login with Google</button></div>
      <div id="userDiv" style="display:none;"><p id="userName"></p><button onclick="logout()">Logout</button></div>
      <hr>
      <button onclick="openCPX()">Complete Survey & Earn Coins</button>
      
    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAaPpt2LjX0nhUoqS8VF...",
      authDomain: "earn-dost-d8c85.firebaseapp.com",
      projectId: "earn-dost-d8c85",
      storageBucket: "earn-dost-d8c85.appspot.com",
      messagingSenderId: "1019395758465",
      appId: "1:1019395758465:web:..." 
    };
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        localStorage.setItem("userId", user.uid);
        localStorage.setItem("userName", user.displayName);
        localStorage.setItem("userEmail", user.email);
        document.getElementById("loginDiv").style.display = "none";
        document.getElementById("userDiv").style.display = "block";
        document.getElementById("userName").innerText = "Hi, " + user.displayName;
      }
    });
    function googleLogin() { firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { firebase.auth().signOut(); localStorage.clear(); }
    function openCPX() {
      let userId = localStorage.getItem("userId");
      if(!userId){ alert("Pehle Google se Login karo"); googleLogin(); return; }
      let cpxUrl = `https://offers.cpx-research.com/index.php?app_id=34757&ext_user_id=${userId}&secure_hash={secure_hash}&username=${localStorage.getItem("userName")}&email=${localStorage.getItem("userEmail")}`;
      window.open(cpxUrl, "_blank");
    }
    </script>
    </body>
    </html>
